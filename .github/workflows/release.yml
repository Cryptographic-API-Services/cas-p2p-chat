# Desktop app releases (release-please, configured in release-please-config.json): on every push
# to `main`, the `release-please` job opens or updates a release PR that bumps the version (root
# and apps/desktop package.json) and adds a CHANGELOG.md entry built from the Conventional Commits
# since the last release. Commits that only touch the server (apps/server, deploy/) don't count.
# Merging that PR makes the job create the `v<version>` tag and GitHub Release, and only then do
# the `test` and `package` jobs run, attaching the Windows, macOS and Linux installers to it.
#
# Every build is x64: cas-typescript-sdk has no arm64 binary yet, so Apple Silicon Macs run the
# macOS build under Rosetta 2. Builds are unsigned (see README, "Installing").

name: Release

on:
  push:
    branches: [ "main" ]

permissions: {}

jobs:
  release-please:
    name: Release PR, tag and GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the v<version> tag and create the GitHub Release
      pull-requests: write  # open and update the release PR
    concurrency:
      group: release-please-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Open the release PR, or tag and release a merged one
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A PR opened with the default GITHUB_TOKEN doesn't trigger the PR workflows. Set the
          # RELEASE_PLEASE_TOKEN secret (GitHub App or fine-grained PAT with Contents and Pull
          # requests read/write) so the PR-title check runs on release PRs.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  test:
    name: Tests
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      # Core and server only: the tests don't need Electron.
      - run: npm ci --ignore-scripts -w @cas-p2p-chat/core -w @cas-p2p-chat/server --include-workspace-root
      - run: npm test

  package:
    name: Package for ${{ matrix.name }}
    needs: [release-please, test]
    runs-on: ${{ matrix.host }}
    permissions:
      contents: write       # attach the installers to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            host: windows-latest
            target: --win
            assets: "*.exe"
          - name: macOS
            # Apple Silicon runner, building the x64 app (electron-builder cross-packages it).
            host: macos-latest
            target: --mac
            assets: "*.dmg *.zip"
          - name: Linux
            host: ubuntu-latest
            target: --linux
            assets: "*.AppImage *.deb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run dist -w @cas-p2p-chat/desktop -- ${{ matrix.target }}
      - name: Attach the installers to the release
        shell: bash
        working-directory: apps/desktop/release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" ${{ matrix.assets }} --clobber --repo "$GITHUB_REPOSITORY"
